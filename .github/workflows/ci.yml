name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Unit tests never launch a browser; skip the ~150MB download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (architecture rules included)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # CRAWL-P1-005 evidence: the fixture smoke suite prints
      # "crawler-fixtures: PASS" on success.
      - name: crawler-fixtures
        run: npm run test:fixtures
